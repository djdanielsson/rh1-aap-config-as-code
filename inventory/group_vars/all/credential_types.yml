---
# Custom credential types for Vault OIDC secret injection into job templates
controller_credential_types_all:
  - name: HashiCorp Vault Value
    description: Inject a single value from HashiCorp Vault via OIDC lookup credential
    kind: cloud
    inputs:
      fields:
        - id: hashicorp_vault_value
          type: string
          label: HashiCorp Vault Value
          secret: true
      required:
        - hashicorp_vault_value
    injectors:
      extra_vars:
        hashicorp_vault_value: !unsafe "{{ hashicorp_vault_value }}"
