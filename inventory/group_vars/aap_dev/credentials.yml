---
# Dev Environment Credentials
# Note: Never put actual secrets here! Use Vault OIDC lookup credentials at runtime.

controller_credentials_dev:
  - name: Dev GitHub Token
    description: GitHub access for dev environment
    organization: platform
    credential_type: Source Control
    # inputs:
    #   username: "{{ lookup('env', 'GITHUB_USERNAME') | default('git') }}"
    #   password: "{{ lookup('env', 'GITHUB_TOKEN') | default('') }}"

  - name: Dev SSH Key
    description: SSH key for dev servers
    organization: platform
    credential_type: Machine
    # inputs:
    #   username: ansible
    #   ssh_key_data: "{{ lookup('env', 'SSH_PRIVATE_KEY') | default('') }}"

  - name: OCP Dev Cluster
    description: OpenShift API token for dynamic inventory (OCP-V)
    organization: platform
    credential_type: OpenShift or Kubernetes API Bearer Token
    # inputs:
    #   host: "https://api.ocp-dev.example.com:6443"
    #   bearer_token: "{{ lookup('env', 'OCP_DEV_TOKEN') | default('') }}"
    #   verify_ssl: true

  - name: sec_vault_app_secrets_hashicorp_dev
    description: HashiCorp Vault OIDC lookup for dev automation
    organization: platform
    credential_type: HashiCorp Vault Secret Lookup (OIDC)
    # inputs:
    #   url: "{{ vault_addr }}"
    #   jwt_path: "{{ vault_jwt_path }}"
    #   role: "{{ vault_oidc_roles.dev }}"
    #   api_version: "{{ vault_api_version }}"

  - name: sec_vault_value_demo_dev
    description: Demo secret value injected from Vault at job runtime
    organization: platform
    credential_type: HashiCorp Vault Value
    # inputs:
    #   hashicorp_vault_value: "<bind via AAP UI to sec_vault_app_secrets_hashicorp_dev>"
