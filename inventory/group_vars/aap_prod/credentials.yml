---
# Production Environment Credentials

controller_credentials_prod:
  - name: Production GitHub Token
    description: GitHub access for production
    organization: platform
    credential_type: Source Control
    # inputs:
    #   username: "{{ lookup('env', 'GITHUB_USERNAME') | default('git') }}"
    #   password: "{{ lookup('env', 'GITHUB_TOKEN') | default('') }}"

  - name: Production SSH Key
    description: SSH key for production servers
    organization: platform
    credential_type: Machine
    # inputs:
    #   username: ansible
    #   ssh_key_data: "{{ lookup('env', 'SSH_PRIVATE_KEY') | default('') }}"

  - name: OCP Prod Cluster
    description: OpenShift API token for dynamic inventory (OCP-V)
    organization: platform
    credential_type: OpenShift or Kubernetes API Bearer Token
    # inputs:
    #   host: "https://api.ocp-prod.example.com:6443"
    #   bearer_token: "{{ lookup('env', 'OCP_PROD_TOKEN') | default('') }}"
    #   verify_ssl: true

  - name: sec_vault_app_secrets_hashicorp_prod
    description: HashiCorp Vault OIDC lookup for production automation
    organization: platform
    credential_type: HashiCorp Vault Secret Lookup (OIDC)
    # inputs:
    #   url: "{{ vault_addr }}"
    #   jwt_path: "{{ vault_jwt_path }}"
    #   role: "{{ vault_oidc_roles.prod }}"
    #   api_version: "{{ vault_api_version }}"

  - name: sec_vault_value_demo_prod
    description: Demo secret value injected from Vault at job runtime
    organization: platform
    credential_type: HashiCorp Vault Value
    # inputs:
    #   hashicorp_vault_value: "<bind via AAP UI to sec_vault_app_secrets_hashicorp_prod>"

  - name: Production Vault Credentials
    description: HashiCorp Vault OIDC access (replaces legacy token lookup)
    organization: platform
    credential_type: HashiCorp Vault Secret Lookup (OIDC)
    # inputs:
    #   url: "{{ vault_addr }}"
    #   jwt_path: "{{ vault_jwt_path }}"
    #   role: "{{ vault_oidc_roles.prod }}"
    #   api_version: "{{ vault_api_version }}"
